services:
  - type: web
    name: innvikta-deepfake-awareness
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "false"
      - key: ADMIN_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: LAUNCH_TOKEN_SECRET
        sync: false
      - key: REQUIRE_LAUNCH_TOKEN
        value: "false"

      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"

      - key: AI_WORKER_CONCURRENCY
        value: 4
      - key: FFMPEG_CONCURRENCY
        value: 2
      - key: AI_MAX_QUEUED_JOBS
        value: 250
      - key: AI_DAILY_BUDGET_USD
        value: 50
      - key: ESTIMATED_SIMULATION_COST_USD
        value: 0.40
      - key: ALLOW_PAID_VIDEO_FALLBACK
        value: "false"

      - key: SCRIPT_MIN_CHARS
        value: 20
      - key: SCRIPT_MAX_CHARS
        value: 180
      - key: SCRIPT_BLOCK_URLS
        value: "true"
      - key: SCRIPT_REQUIRE_AWARENESS_CONTEXT
        value: "false"

      - key: VOICE_PROVIDER
        value: qwen
      - key: QWEN_MODEL
        value: qwen/qwen3-tts
      - key: QWEN_LANGUAGE
        value: auto
      - key: MAX_REFERENCE_AUDIO_SECONDS
        value: 60
      - key: MAX_VIDEO_SECONDS
        value: 10

      - key: FLUX_ENABLED
        value: "true"
      - key: FLUX_MODEL
        value: black-forest-labs/flux-2-pro

      - key: VIDEO_PROVIDER_PREFERENCE
        value: pruna
      - key: PRUNA_MODEL
        value: prunaai/p-video-avatar
      - key: PRUNA_RESOLUTION
        value: 720p
      - key: DID_ADAPTER_ENABLED
        value: "false"
      - key: HEYGEN_ADAPTER_ENABLED
        value: "false"

      - key: MAX_IMAGE_SIZE_MB
        value: 8
      - key: MAX_AUDIO_SIZE_MB
        value: 20
      - key: MEDIA_RETENTION_MINUTES
        value: 30
      - key: RATE_LIMIT_MAX
        value: 250
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 15
