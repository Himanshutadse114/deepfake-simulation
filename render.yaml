services:
  - type: web
    name: innvikta-deepfake-awareness
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "false"
      - key: ADMIN_KEY
        sync: false
      - key: SCRIPT_MIN_CHARS
        value: 20
      - key: SCRIPT_MAX_CHARS
        value: 180
      - key: SCRIPT_BLOCK_URLS
        value: "true"
      - key: SCRIPT_REQUIRE_AWARENESS_CONTEXT
        value: "false"
      - key: VOICE_PROVIDER
        value: qwen
      - key: QWEN_MODEL
        value: qwen/qwen3-tts
      - key: QWEN_LANGUAGE
        value: auto
      - key: MAX_REFERENCE_AUDIO_SECONDS
        value: 45
      - key: MAX_GENERATED_AUDIO_SECONDS
        value: 10
      - key: MAX_VIDEO_SECONDS
        value: 10
      - key: FLUX_ENABLED
        value: "true"
      - key: FLUX_MODEL
        value: black-forest-labs/flux-2-pro
      - key: FLUX_GRID_IMAGES
        value: 4
      - key: VIDEO_PROVIDER_PREFERENCE
        value: pruna
      - key: PRUNA_RESOLUTION
        value: 720p
      - key: DID_ADAPTER_ENABLED
        value: "false"
      - key: HEYGEN_ADAPTER_ENABLED
        value: "false"
      - key: MAX_IMAGE_SIZE_MB
        value: 8
      - key: MAX_AUDIO_SIZE_MB
        value: 20
      - key: MEDIA_RETENTION_MINUTES
        value: 30
      - key: RATE_LIMIT_MAX
        value: 3
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 60
      - key: SESSION_SECRET
        generateValue: true
