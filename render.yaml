services:
  - type: web
    name: innvikta-deepfake-awareness
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: MAX_IMAGE_SIZE_MB
        value: 8
      - key: MAX_AUDIO_SIZE_MB
        value: 20
      - key: MEDIA_RETENTION_MINUTES
        value: 30
      - key: RATE_LIMIT_MAX
        value: 3
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 60
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DID_API_KEY
        sync: false
