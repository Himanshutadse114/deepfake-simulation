services:
  - type: web
    name: innvikta-deepfake-awareness
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "false"
      - key: ADMIN_KEY
        sync: false
      - key: SCRIPT_MIN_CHARS
        value: 20
      - key: SCRIPT_MAX_CHARS
        value: 180
      - key: SCRIPT_MAX_WORDS
        value: 26
      - key: SCRIPT_BLOCK_URLS
        value: "true"
      - key: SCRIPT_REQUIRE_AWARENESS_CONTEXT
        value: "false"
      - key: VOICE_PROVIDER
        value: qwen
      - key: QWEN_MODEL
        value: qwen/qwen3-tts
      - key: QWEN_LANGUAGE
        value: English
      - key: WHISPER_MODEL
        value: openai/whisper:8099696689d249cf8b122d833c36ac3f75505c666a395ca40ef26f68e7d3d16e
      - key: WHISPER_LANGUAGE
        value: english
      - key: MIN_REFERENCE_AUDIO_SECONDS
        value: 3
      - key: MAX_REFERENCE_AUDIO_SECONDS
        value: 15
      - key: VOICE_GENERATION_ATTEMPTS
        value: 2
      - key: TRANSCRIPT_MAX_WORD_ERROR_RATE
        value: 0.05
      - key: MAX_VIDEO_SECONDS
        value: 10
      - key: FLUX_ENABLED
        value: "true"
      - key: FLUX_MODEL
        value: black-forest-labs/flux-2-pro
      - key: VIDEO_PROVIDER_PREFERENCE
        value: pruna
      - key: PRUNA_RESOLUTION
        value: 720p
      - key: DID_ADAPTER_ENABLED
        value: "false"
      - key: HEYGEN_ADAPTER_ENABLED
        value: "false"
      - key: MAX_IMAGE_SIZE_MB
        value: 8
      - key: MAX_AUDIO_SIZE_MB
        value: 20
      - key: MEDIA_RETENTION_MINUTES
        value: 30
      - key: RATE_LIMIT_MAX
        value: 3
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: 60
      - key: SESSION_SECRET
        generateValue: true
