name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm install
      - name: Install client dependencies
        run: npm --prefix client install
      - name: Unit tests
        run: npm test
      - name: Syntax check server and UI runtime
        run: |
          node --check server/index.js
          node --check server/routes.js
          node --check server/pipeline.js
          node --check server/media.js
          node --check server/store.js
          node --check server/storage.js
          node --check server/queue.js
          node --check server/worker.js
          node --check server/redis-client.js
          node --check server/cost-guard.js
          node --check server/launch-token.js
          node --check server/script-policy.js
          node --check server/script-audit.js
          node --check server/admin.js
          node --check server/admin-settings.js
          node --check server/demo.js
          node --check server/services/qwen.js
          node --check server/services/chatterbox.js
          node --check server/services/elevenlabs.js
          node --check server/services/flux.js
          node --check server/services/did.js
          node --check server/services/heygen.js
          node --check server/services/pruna.js
          node --check server/services/replicate-retry.js
          node --check server/services/replicate-prediction.js
          node --check server/services/download.js
          node --check server/services/process-limit.js
          node --check server/services/audio-duration.js
          node --check server/services/watermark.js
          node --check server/scripts/watermark-smoke.js
          cat client/public/ui-js-1.txt client/public/ui-js-2.txt client/public/ui-js-3.txt > /tmp/innvikta-ui.js
          node --check /tmp/innvikta-ui.js
          node --check client/public/ui-bootstrap.js
          node --check client/public/generation-safety.js
          node --check client/public/admin-ui.js
          node --check client/public/voice-recording-prompt.js
          node --check client/public/voice-sample-controls.js
          node --check client/public/queue-status-ui.js
          node --check client/public/instagram-video-grid.js
          node --check client/public/whatsapp-friendly-flow.js
          node --check client/public/wa-polish.js
          node --check client/public/wa-flow-fix.js
          node --check client/public/wa-replay-reset.js
          node --check client/public/wa-call-ringtone.js
          node --check client/public/editorial-scroll-reset.js
          node --check client/public/camera-face-guide.js
          node --check client/scripts/prepare-face-detector-assets.mjs
          node --check client/public/experience-polish.js
      - name: Build client
        run: npm --prefix client run build
      - name: Build Docker image
        run: docker build -t deepfake-awareness:test .
      - name: FFmpeg watermark smoke test in production image
        run: docker run --rm deepfake-awareness:test node server/scripts/watermark-smoke.js
